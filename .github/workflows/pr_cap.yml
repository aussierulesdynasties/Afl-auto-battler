# The open PR cap, enforced (Director Bible 7.48: at most 3 ready PRs; director 2026-11-26:
# merges took days because 30+ ready PRs shared about 20 GitHub runners).
#
# Ready PRs beyond the 3 oldest go back to draft with the label "waiting-for-slot" and one
# comment. Drafts skip the game tests (and drafting cancels a running check), so a waiting PR
# takes no runners. When a slot frees, the oldest waiting PR is marked ready again, which
# starts its Tests run. Every run sweeps the whole open set, so a dropped event loses nothing.
#
# Not counted and never drafted: bot PRs (the rolling roadmap PR) and PRs labelled
# "cap-exempt" (the director's override for an urgent fix).
#
# pull_request_target, so it runs from main with a token that can edit the PR. It never
# checks out or runs the PR's code: it only reads PR numbers, draft flags and labels.
# Draft and ready changes use MERGE_TOKEN (an admin's token). A change made with the workflow
# token would start no Tests run when a PR is marked ready.
name: PR cap
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: pr-cap
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: write   # labels and comments use the issues API

env:
  CAP: 3

jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hold new PRs over the cap, release waiting ones when a slot frees
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -u
          gh label create waiting-for-slot --color BFD4F2 --description "Over the 3 ready PR cap; marked ready when a slot frees" 2>/dev/null || true
          gh label create cap-exempt --color D93F0B --description "Director's override: not held by the PR cap" 2>/dev/null || true

          # Ready PRs that count: not draft, not a bot's, not exempt.
          counted='[.[] | select(.isDraft | not) | select(.author.is_bot | not)
                    | select(.author.login != "github-actions[bot]")
                    | select(all(.labels[]; .name != "cap-exempt"))]'
          # REST, not `gh pr list --json author`: gh's author query asks for an app author's owner
          # fields, which need read:org, and MERGE_TOKEN has only repo (failed on 26 Nov). The jq
          # gives the same shape the filters below read.
          list() { gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --paginate --jq '.[] | {number, isDraft: .draft,
            author: {login: .user.login, is_bot: (.user.type == "Bot")}, labels: [.labels[] | {name}], createdAt: .created_at}' | jq -s .; }

          # No `gh pr edit/comment/ready` either: they load the PR's assignees, reviewers and
          # projects over GraphQL, whose login fields need read:org (run 45895825968, PR #2207).
          # REST for labels and comments, and the two mutations select nothing but isDraft.
          node() { gh api "repos/$GH_REPO/pulls/$1" --jq .node_id; }
          draft() { gh api graphql -f id="$(node "$1")" \
            -f query='mutation($id: ID!) { convertPullRequestToDraft(input: {pullRequestId: $id}) { pullRequest { isDraft } } }' >/dev/null; }
          ready() { gh api graphql -f id="$(node "$1")" \
            -f query='mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { pullRequest { isDraft } } }' >/dev/null; }
          label_add() { gh api -X POST "repos/$GH_REPO/issues/$1/labels" -f 'labels[]=waiting-for-slot' >/dev/null; }
          label_rm() { gh api -X DELETE "repos/$GH_REPO/issues/$1/labels/waiting-for-slot" >/dev/null || true; }
          comment() { gh api "repos/$GH_REPO/issues/$1/comments" -f body="$2" >/dev/null; }

          # Every run sweeps the whole open set, whatever woke it. GitHub keeps one pending run per
          # concurrency group and cancels the rest, and drops most cron events, so no single
          # event can be relied on: each run puts the whole state right.
          all=$(list)
          # Over the cap: the newest ready PRs go back to draft, so the oldest keep their place.
          for num in $(echo "$all" | jq -r "$counted | sort_by(.createdAt) | .[$CAP:] | .[].number"); do
            if draft "$num"; then
              label_add "$num"
              comment "$num" "Held as a draft: $CAP older PRs are ready and the cap is $CAP (Director Bible 7.48). Drafts take no CI runners. This PR is marked ready again on its own when a slot frees, oldest waiting first. To wait, keep working on the branch. Marking it ready by hand puts it straight back."
              echo "#$num: held"
            else
              echo "::warning::could not turn #$num into a draft"
            fi
          done
          all=$(list)
          n=$(echo "$all" | jq "$counted | length")
          # Under the cap: release the oldest waiting PRs into the free slots.
          for num in $(echo "$all" | jq -r '[.[] | select(.isDraft) | select(any(.labels[]; .name == "waiting-for-slot"))] | sort_by(.createdAt) | .[].number'); do
            [ "$n" -ge "$CAP" ] && break
            label_rm "$num"
            if ready "$num"; then
              comment "$num" "A slot freed: marked ready, so its Tests run starts now."
              n=$((n + 1))
              echo "#$num: released"
            else
              echo "::warning::could not mark #$num ready"
            fi
          done
          echo "$n ready PR(s) counted against a cap of $CAP"
