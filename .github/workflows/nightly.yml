name: Nightly long suites

# Fast gate (director 2026-11-04): pull requests and the main-push gate skip the
# long suites in tools/ci_long_suites.txt. This workflow runs them in full every
# night and after each push to main, one suite per runner, and keeps one issue
# open while they fail (closed by the next green run). It never blocks a pull request.
on:
  schedule:
    - cron: "0 16 * * *"   # 03:00 Melbourne (AEDT)
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          suites=$( (grep -vE '^[[:space:]]*(#|$)' tools/ci_long_suites.txt; echo calibration) | sort -u | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  long:
    name: long ${{ matrix.suite }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip" \
          || curl -fsSL --retry 3 -o godot.zip \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip && rm godot.zip
          mv "${name}" godot && chmod +x godot
      - name: Run ${{ matrix.suite }}
        run: SUITE_TIMEOUT=3000 SUITES_ONLY=1 GODOT="$HOME/godot/godot" LOG_DIR="$RUNNER_TEMP/test-logs" tools/run_tests.sh ${{ matrix.suite }}
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs-${{ matrix.suite }}
          path: ${{ runner.temp }}/test-logs
          if-no-files-found: ignore

  # One open issue at a time, titled "Nightly long suites failing": a red run opens it
  # or comments on it; the next green run closes it. Cancelled runs say nothing.
  report:
    needs: long
    if: always() && (needs.long.result == 'success' || needs.long.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open, update or close the failing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.long.result }}
          EVENT: ${{ github.event_name }}
        run: |
          title="Nightly long suites failing"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title==\"$title\")][0].number // empty")
          if [ "$RESULT" = failure ]; then
            msg="A long suite failed on ${GITHUB_SHA} (${EVENT}). Run: ${run_url}"
            if [ -n "$num" ]; then gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$msg"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$msg"; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Green again on ${GITHUB_SHA} (${EVENT}). Run: ${run_url}"
          fi
