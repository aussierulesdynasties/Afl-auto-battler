# One-off on a throwaway branch (never merged): widen the main merge queue to build and
# merge up to 5 PRs at once (director, 2026-11-21). Dispatched from this branch only.
name: Docs fast merge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Set merge queue group size to 5
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          id=$(gh api "repos/$GH_REPO/rulesets" --jq '.[] | select(.name == "main merge queue") | .id')
          echo "ruleset $id"
          gh api "repos/$GH_REPO/rulesets/$id" > before.json
          echo "before:"; jq -c '.rules[] | select(.type == "merge_queue") | .parameters' before.json
          jq '{name, target, enforcement, conditions, bypass_actors,
               rules: [.rules[] | if .type == "merge_queue"
                 then .parameters += {max_entries_to_build: 5, max_entries_to_merge: 5, min_entries_to_merge: 1}
                 else . end]}' before.json > body.json
          gh api -X PUT "repos/$GH_REPO/rulesets/$id" --input body.json > /dev/null
          echo "after:"
          gh api "repos/$GH_REPO/rulesets/$id" --jq '(.rules[] | select(.type == "merge_queue") | .parameters | tostring), ("bypass: " + ([.bypass_actors[] | "\(.actor_type):\(.bypass_mode)"] | join(", ")))'
