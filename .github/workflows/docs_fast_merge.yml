# Docs and roadmap notes skip the merge queue (director, 2026-11-21: keep the queue for code,
# let docs-only and roadmap-note PRs skip it). The queue retests each PR on top of the latest
# main so two code PRs cannot combine to break it; a PR that only changes Markdown cannot do
# that, and the roadmap-close notes PRs (label "roadmap") were stuck behind it.
#
# After each Tests run (and hourly as a backstop; every 10 minutes was 100+ runs a day), this merges straight into main any open PR that:
#   - has auto-merge turned on (the author asked for it to land),
#   - is labelled "roadmap" or changes only *.md files,
#   - has no conflict, and every check on its head has passed (or skipped).
# With no merge queue on main (the ruleset was removed), there is nothing to wait for. Until
# 2026-11-26 the queue lookup failed then, read as "unknown", and this merged nothing at all.
# It waits while any PR is in the merge queue (director, 2026-11-22: "yes" to docs notes
# waiting until the queue is empty). A merge straight onto main makes the queue throw away
# and restart every group it is testing; one roadmap note cost the front five PRs 45 minutes.
# If the queue can't be read, it waits too.
# It merges with --admin using the MERGE_TOKEN secret, an admin's token: the "main merge
# queue" ruleset lets Repository admins bypass it, and the GitHub Actions app cannot be
# added there. Without the secret it tries the workflow token, which the ruleset refuses;
# the job then lists the rulesets on main and stops. A MERGE_TOKEN merge starts the push
# workflows as usual; this also runs Roadmap rebuild itself, for the notes PRs the merge
# has left in conflict.
name: Docs fast merge
on:
  schedule:
    - cron: "41 * * * *"   # hourly backstop; the Tests trigger below does the real work
  workflow_run:
    workflows: [Tests]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: docs-fast-merge-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
  pull-requests: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge ready docs-only and roadmap PRs
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          merged=0
          # Is there a merge queue on main at all? (REST: the rules that apply to the branch.)
          has_queue=$(gh api "repos/$GH_REPO/rules/branches/main" --jq '[.[] | select(.type == "merge_queue")] | length' 2>/dev/null) || has_queue=""
          if [ "$has_queue" = "0" ]; then
            queued=0
          else
            queued=$(gh api graphql -f owner="${GH_REPO%%/*}" -f name="${GH_REPO##*/}" -f query='
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  mergeQueue(branch: "main") { entries { totalCount } }
                }
              }' --jq '.data.repository.mergeQueue.entries.totalCount // 0' 2>/dev/null) || queued=""
          fi
          if [ "$queued" != "0" ]; then
            echo "Merge queue holds ${queued:-an unknown number of} PR(s); docs and roadmap PRs wait until it is empty."
            exit 0
          fi
          prs=$(gh pr list --state open --limit 200 --json number,isDraft,autoMergeRequest \
            --jq '.[] | select(.isDraft | not) | select(.autoMergeRequest != null) | .number')
          [ -z "$prs" ] && { echo "No open PR has auto-merge on."; exit 0; }
          for num in $prs; do
            info=$(gh pr view "$num" --json labels,files,mergeable,statusCheckRollup)
            kind=$(echo "$info" | jq -r '
              if any(.labels[]; .name == "roadmap") then "roadmap"
              elif (.files | length) > 0 and all(.files[]; .path | endswith(".md")) then "docs"
              else "code" end')
            [ "$kind" = "code" ] && continue
            mergeable=$(echo "$info" | jq -r .mergeable)
            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "#$num ($kind): $mergeable, waiting"
              continue
            fi
            # Every check finished green or skipped; none pending, none red.
            bad=$(echo "$info" | jq -r '[.statusCheckRollup[] |
              (if .__typename == "StatusContext" then .state else (.conclusion // "PENDING") end)
              | select(. != "SUCCESS" and . != "SKIPPED" and . != "NEUTRAL")] | length')
            total=$(echo "$info" | jq -r '.statusCheckRollup | length')
            if [ "$total" = 0 ] || [ "$bad" != 0 ]; then
              echo "#$num ($kind): checks not all green yet ($bad of $total), waiting"
              continue
            fi
            if GH_TOKEN="${MERGE_TOKEN:-$GH_TOKEN}" gh pr merge "$num" --squash --admin; then
              echo "#$num ($kind): merged past the queue"
              merged=1
              # One at a time: notes PRs edit the same TODO.md lines, so the next one
              # is rebuilt on the new main before it merges.
              break
            else
              if [ -n "$MERGE_TOKEN" ]; then tok="MERGE_TOKEN"; else tok="workflow token, no MERGE_TOKEN secret"; fi
              echo "::warning::#$num: merge refused using the $tok. The PR waits for the queue."
              # Say which rulesets apply to main and whether this token may bypass each,
              # then stop: every other PR would be refused the same way.
              echo "Rulesets on main (name | source | enforcement | can bypass | rules):"
              for id in $(gh api "repos/$GH_REPO/rulesets?includes_parents=true" --jq '.[].id'); do
                gh api "repos/$GH_REPO/rulesets/$id" --jq \
                  '"\(.name) | \(.source_type) \(.source) | \(.enforcement) | \(.current_user_can_bypass // "?") | \([.rules[].type] | join(","))"' \
                  || echo "ruleset $id: not readable"
              done
              break
            fi
          done
