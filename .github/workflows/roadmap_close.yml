# PRs never edit docs/TODO.md (parallel PRs conflicted there). A PR body names the
# rows it finishes with "Closes row 54" / "Closes rows 22, 27" / "Closes row T5.Q24",
# and the rows it advances with "Part of row 142"; after the merge this deletes the
# finished rows from main (docs/TODO.md, and section V of docs/TODO_RULINGS.md) and
# lists each advanced one in docs/TODO_MERGED.md as "- 142: Merged #N: title." (the rows stay
# put, so TODO.md keeps under its 60 KB budget), so the list never falls behind what
# has landed (director 2026-11-14).
#
# A bot push to main is refused (main requires "test"), so the notes go through a PR.
# Since 2026-11-26 that is one rolling PR, not one per merge: tools/roadmap_batch.sh
# rebuilds the branch roadmap-close/batch on the latest main with every merged PR it
# holds plus this one, so it never conflicts and costs one Tests run, not one per merge.
# The old one-per-merge PRs piled up in conflict on row 202 and each took a runner.
# Docs fast merge lands it once its docs-only check is green. Needs the repo setting
# "Allow GitHub Actions to create and approve pull requests".
name: Roadmap close
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: roadmap-close
  cancel-in-progress: false

permissions:
  contents: write
  actions: write        # dispatch tests.yml on the batch branch, approve its held run
  pull-requests: write  # open, edit and auto-merge the batch PR

jobs:
  close:
    # The batch PR's own merge notes nothing.
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'roadmap-close/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            docs
            tools
      - name: Add this PR to the rolling roadmap PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: tools/roadmap_batch.sh "$PR"
