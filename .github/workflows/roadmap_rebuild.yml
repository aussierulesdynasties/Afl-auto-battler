# The rolling roadmap PR (tools/roadmap_batch.sh) is rebuilt on the latest main every
# time a PR merges, so it should never conflict. If something else edits TODO.md on main
# (a hand edit, a PR that broke the rule), this rebuilds it after the push. It also folds in
# and closes any one-per-merge roadmap-close/pr-N PR left from before 2026-11-26.
name: Roadmap rebuild
on:
  push:
    branches: [main]
    paths:
      - "docs/TODO.md"
      - "docs/TODO_RULINGS.md"
      - "docs/TODO_MERGED.md"
  workflow_dispatch:

concurrency:
  group: roadmap-close
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            docs
            tools
      - name: Rebuild the rolling roadmap PR on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/roadmap_batch.sh
