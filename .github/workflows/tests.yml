name: Tests

# Code/data/config pull requests and pushes to main run the full check:
# project import, every Godot test suite, the dataset check and the intake
# harness. Documentation-only changes skip this expensive game test run.
# If a PR changes both docs and game files, the tests still run.
# Two more cases skip the game tests (the plan job sets code=false): a draft PR
# (a run starts when it is marked ready for review; until then "test" is red, so
# a draft can never merge on a run that tested nothing), and a PR that only touches
# audit or capture scripts (tools/audit, tools/visual), which no suite loads.
#
# The suites run as parallel shards (tools/ci_shards.txt), so a pull request
# spreads the workload across runners. Every tests/run_<suite>_tests.gd is a
# suite; nothing lists them by hand. The layout is planned from a real run's
# suite timings (tools/ci_suite_timings.json); a suite added since the last
# re-plan joins the lightest shard on its own (tools/ci_shards.py). The test job prints each shard's
# observed time and warns when one runs long, but never fails on it. Long
# suites (tools/ci_long_suites.txt, over about 240 s each) never run here: the
# nightly workflow (nightly.yml) runs them in full. A pull request runs only the suites that cover its changed files, plus a
# smoke set (tools/select_suites.py); anything it cannot trace (data/, project.godot,
# the harness, this workflow) runs everything, and a push to main always runs the full wall.
# The "lint" job runs the static checks (tools/lint/README.md: copy voice, colour cues, type
# roles, sim boundaries, the autoload compile rule, gdlint) and the pure-Python data checks with
# no Godot, beside the plan and the preflight; the shards and the extras job need it, so a
# broken rule stops the run in about a minute. One more job runs the
# export-data and harness checks once. tools/run_tests.sh is the same
# script you run locally, on every suite or on some of them.
#
# "test" is a required check on main. It is the last job and passes when the
# plan, every shard and the extras job passed. For a docs-only PR the shards are
# skipped and it passes in seconds. Pushes to main that only touch docs don't
# start this workflow at all.
on:
  pull_request:
    # converted_to_draft: a PR turned back into a draft (by hand, or by the PR cap) gets a new run,
    # which cancels the one in progress (concurrency below) and runs nothing. Without it the old run
    # kept its runners: 7 drafts' runs were still going on 2026-11-26 after the cap drafted them.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # The merge queue (ruleset on main, director 2026-11-12) needs "test" on the queued
  # group: the PR on top of main and every PR ahead of it. A group runs the suites that
  # cover everything it changes against the main it was built on (tools/select_suites.py,
  # the same pick a pull request gets, so a change it cannot trace still runs the full
  # wall; docs-only groups skip the game tests). Only a full-wall group records its tree,
  # so after a partial group the push to main runs every suite but the long ones
  # (tools/ci_same_tree.sh): the full check still runs on main, after the merge.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      changed_files:
        description: "Pretend a pull request changed these files (space-separated) and run just the suites they select"
        required: false
        default: ""

# Where the jobs run: GitHub's runners, or the director's PC (self-hosted runners labelled
# "afl-queue", in WSL, 2 runners capped at 8 GB) while the repo variable QUEUE_RUNNER is "pc"
# (director, 2026-11-25: "turn the PC runners on"). A merge-queue group takes the PC when one of
# its runners is online; a pull request from this repo or a push to main takes it only when one is
# online and idle, so the PC adds to GitHub's runners instead of queueing work behind itself. The
# plan job, always on GitHub, checks that with the runners API (secret MERGE_TOKEN) and hands its
# choice to every other job. With the PC paused (WSL shut down) everything runs on GitHub's
# runners; nothing needs switching. A fork's pull request never reaches the PC.
# docs/CI_RUNNER.md has the setup.
#
# A newer push to a PR supersedes its older run. Pushes to main share one group that is never
# cancelled in progress: one main run at a time, and while it runs only the newest waiting push
# is kept (GitHub drops an older pending run). Director 2026-11-26, "Tests only, web build
# nightly": every merge used to get its own full run, and 25 of 35 were cancelled by hand on
# 25-26 Nov, some after every shard had passed. A break is still caught on the next run, which
# may cover two or three merges.
concurrency:
  group: tests-${{ github.event_name == 'push' && 'main-push' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  actions: read          # tools/ci_same_tree.sh reads the PR's green run
  pull-requests: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  # Decides whether the game tests run, and lays out the shards.
  plan:
    # A draft runs nothing but the final "test" check, which stays red until the PR is
    # marked ready (that event starts the real run), so a draft never queues runners.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # While QUEUE_RUNNER is "pc", this repo's runs plan on the PC's small "afl-plan" runner (it only
    # plans, so it is free within seconds) instead of waiting in GitHub's queue; forks plan on GitHub.
    runs-on: ${{ (vars.QUEUE_RUNNER == 'pc' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","afl-plan"]') || 'ubuntu-latest' }}
    timeout-minutes: 20   # a PC runner's first checkout fetches about 1.6 GB
    outputs:
      code: ${{ steps.changes.outputs.code }}
      reason: ${{ steps.changes.outputs.reason }}
      sim: ${{ steps.changes.outputs.sim }}
      shards: ${{ steps.shards.outputs.matrix }}
      partial: ${{ steps.shards.outputs.partial }}
      runner: ${{ steps.runner.outputs.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2     # the PR merge commit and the base it merges into
          filter: blob:none   # fetch only the files checked out
          sparse-checkout-cone-mode: false
          sparse-checkout: |   # .claude/review (5 GB of review boards) is never read by CI
            /*
            !/.claude/review/

      # While QUEUE_RUNNER is "pc": a merge-queue group goes to the PC when an afl-queue runner is
      # online; this repo's pull requests and pushes to main when one is online and idle. Forks, and
      # any doubt (no token, API error, PC paused), stay on GitHub's runners.
      - name: Pick where the jobs run
        id: runner
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
          WANT: ${{ vars.QUEUE_RUNNER }}
        run: |
          pick='"ubuntu-latest"'
          ev="${{ github.event_name }}"
          own=no
          case "$ev" in
            merge_group) own=queue ;;
            push|workflow_dispatch) own=idle ;;
            pull_request) [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] && own=idle ;;
          esac
          if [ "$WANT" = pc ] && [ "$own" != no ]; then
            n=0
            want_idle=$([ "$own" = idle ] && echo true || echo false)
            if [ -n "$GH_TOKEN" ]; then
              n=$(gh api "repos/${{ github.repository }}/actions/runners" \
                --jq "[.runners[] | select(.status == \"online\" and ([.labels[].name] | index(\"afl-queue\"))
                  and ($want_idle == false or .busy == false))] | length" \
                2>/dev/null) || n=0
            fi
            echo "PC runners online$([ "$own" = idle ] && echo ' and idle'): ${n:-0}"
            if [ "${n:-0}" -gt 0 ]; then pick='["self-hosted","Linux","X64","afl-queue"]'; fi
          fi
          echo "Jobs run on: $pick" >> "$GITHUB_STEP_SUMMARY"
          echo "runs_on=$pick" >> "$GITHUB_OUTPUT"

      # Anything outside docs/, *.md files, the audit and capture scripts and the lints
      # (tools/audit/, tools/visual/, tools/lint/) counts as code. A draft PR runs no game
      # tests until it is marked ready for review.
      - name: Check for code changes
        id: changes
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PRETEND: ${{ inputs.changed_files }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          code=true
          reason=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$IS_DRAFT" = "true" ]; then
              code=false
              reason="draft pull request: the game tests run when it is marked ready for review"
            elif ! git diff --name-only HEAD^1 HEAD | grep -qvE '^docs/|\.md$|^tools/audit/|^tools/visual/|^tools/lint/'; then
              code=false
              reason="documentation, audit or capture scripts or the static lints only (the lint job checks those)"
            fi
          fi
          # roadmap_close.yml dispatches this on its docs/TODO.md-only commit to earn
          # the required "test" check before it pushes to main.
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ -n "$PRETEND" ] && ! printf '%s\n' $PRETEND | grep -qvE '^docs/|\.md$'; then
            code=false
            reason="dispatched for documentation only"
          fi
          # A push to main whose files are exactly what the PR's last green run
          # tested (an up-to-date branch squashed) proves nothing new: skip the
          # shards. Any doubt runs them; the log says which and why.
          if [ "${{ github.event_name }}" = push ]; then
            if why=$(GH_TOKEN="${{ github.token }}" bash tools/ci_same_tree.sh "${{ github.sha }}" "${{ github.repository }}"); then
              code=false
              reason="${why#Skip: }"
            fi
            echo "$why"
          fi
          # A merge-queue group: diff the group's head against the main it was built on.
          if [ "${{ github.event_name }}" = merge_group ]; then
            git fetch -q --no-tags --depth=1 origin "$MQ_BASE"
            if ! git diff --name-only "$MQ_BASE" HEAD | grep -qvE '^docs/|\.md$|^tools/audit/|^tools/visual/|^tools/lint/'; then
              code=false
              reason="merge queue group of documentation, audit or capture scripts or the static lints only"
            fi
          fi
          if [ "$code" = false ]; then echo "Skipping the game tests ($reason)."; fi
          # Pull requests run calibration only when the sim or the data changed.
          sim=true
          if [ "${{ github.event_name }}" = "pull_request" ] && ! git diff --name-only HEAD^1 HEAD | grep -qE '^(scripts/sim/|data/)'; then
            sim=false
          fi
          echo "sim=$sim" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      # Every suite on disk runs in exactly one shard: a new one joins the
      # lightest shard, a removed one is dropped (tools/ci_shards.py).
      - name: Lay out the shards
        id: shards
        env:
          PRETEND: ${{ inputs.changed_files }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # Fast gate (director 2026-11-04): pull requests and pushes to main skip the
          # long suites in tools/ci_long_suites.txt (over about 240 s on CI); the
          # nightly workflow (nightly.yml) runs them in full. The rest pack into
          # shards of about 240 s (tools/ci_shards.py --only), so the gate stays under 10 minutes.
          long=$(grep -vE '^[[:space:]]*(#|$)' tools/ci_long_suites.txt | xargs)
          skip="$long"
          # Pull requests run calibration only when scripts/sim/ or data/ changed.
          if [ "${{ github.event_name }}" = pull_request ] && [ "${{ steps.changes.outputs.sim }}" != true ]; then skip="$skip calibration"; fi
          suites=$(tools/list_suites.sh tests | xargs)
          # A pull request runs the suites that cover its changed files plus the smoke set
          # (tools/select_suites.py); pushes to main run every suite but the long ones.
          partial=false
          files=""
          if [ "${{ github.event_name }}" = pull_request ]; then files=$(git diff --name-only --no-renames HEAD^1 HEAD); fi
          # A queue group picks from everything it changes against the main it was built on
          # (the base was fetched by the step above). Queue time is spent waiting for runners,
          # so a group of ground PRs runs their few suites, not the whole wall.
          if [ "${{ github.event_name }}" = merge_group ]; then files=$(git diff --name-only --no-renames "$MQ_BASE" HEAD); fi
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then files="$PRETEND"; fi
          if [ -n "$files" ]; then
            pick=$(python3 tools/select_suites.py --json --files $files)
            echo "Selection: $pick"
            note=$(printf '%s' "$pick" | python3 -c 'import json,sys; print(json.load(sys.stdin)["note"])')
            if [ "$(printf '%s' "$pick" | python3 -c 'import json,sys; print(json.load(sys.stdin)["partial"])')" = True ]; then
              partial=true
              suites=$(printf '%s' "$pick" | python3 -c 'import json,sys; print(json.load(sys.stdin)["suites"])')
              # Calibration runs on every pull request that touches the sim, whatever its suites cover.
              if [ "${{ steps.changes.outputs.sim }}" = true ]; then suites="$suites calibration"; fi
            fi
            {
              echo "### Suites this run needs"
              echo "$note. Changed: $(printf '%s' "$files" | wc -w) files."
              if [ "$partial" = true ]; then echo "Suites: $suites. A push to main runs every suite but the long ones."; fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Long suites (nightly.yml runs them in full): $long" >> "$GITHUB_STEP_SUMMARY"
          echo "partial=$partial" >> "$GITHUB_OUTPUT"
          python3 tools/ci_shards.py   # the shard plan itself must still be valid
          matrix=$(python3 tools/ci_shards.py --matrix --only "$suites" --skip "$skip")
          echo "Shards: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # A document every agent must read in full has to fit one read (director,
      # 2026-10-10: skimming is a sin; a doc too long to read is split, never skimmed).
      - name: Check must-read documents fit one read
        run: python3 tools/check_doc_sizes.py

      # The build number lives in project.godot config/version and nowhere else.
      - name: Check the build number has one source
        run: |
          python3 tools/test_check_version.py
          python3 -I tools/check_version.py

      # PRs never edit docs/TODO.md; they write "Closes row N" in the body and
      # roadmap_close.yml deletes the row after the merge. Label "roadmap" exempts
      # a PR that really edits the list. Labels are read live (not from the event),
      # so after adding the label a re-run of the failed jobs passes; label changes
      # deliberately don't trigger this workflow (they'd cancel and re-run every shard).
      - name: Check the PR leaves docs/TODO.md alone
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/test_roadmap_close.py
          if git diff --name-only HEAD^1 HEAD | grep -qx 'docs/TODO.md'; then
            labels=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.labels[].name' | xargs)
            case " $labels " in *" roadmap "*) echo "docs/TODO.md edit allowed: label roadmap"; exit 0 ;; esac
            echo "::error file=docs/TODO.md::This PR edits docs/TODO.md. Revert that and write 'Closes row N' (or 'Closes rows 22, 27') on its own line in the PR body; the row is deleted after merge. To edit the list itself, add the label 'roadmap' and re-run the failed jobs."
            exit 1
          fi

      # Every PR names its place in the list (director 2026-11-14, after 25 merges left
      # docs/TODO.md behind): "Closes row N", "Part of row N" (roadmap_close.yml notes the
      # merge on the row) or "No row: <why>". The body is read live, so editing it and
      # re-running the failed jobs passes.
      - name: Check the PR names its TODO row
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A PR labelled "roadmap" edits the list itself (the Roadmap close action's
          # own PRs, whose body names no row): it has no row of its own to name.
          labels=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.labels[].name' | xargs)
          case " $labels " in *" roadmap "*) echo "Row check skipped: label roadmap"; exit 0 ;; esac
          gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/body.txt"
          if ! python3 tools/roadmap_close.py --check --body-file "$RUNNER_TEMP/body.txt" --todo docs/TODO.md --todo docs/TODO_RULINGS.md 2> "$RUNNER_TEMP/err.txt"; then
            echo "::error::$(cat "$RUNNER_TEMP/err.txt")"
            exit 1
          fi

      # The shard layout's own tests, and the estimated shard seconds. Imbalance
      # is reported after the run, never a failure. Never reduce assertions to speed CI up.
      - name: Check the shard layout
        run: |
          python3 tools/test_ci_shards.py
          python3 tools/test_select_suites.py
          python3 tools/check_ci_balance.py

  # Static lints (tools/lint/README.md), no Godot: about a minute, beside plan and the preflight.
  # The shards and the extras job need it, so a broken source rule fails the run before any
  # suite starts instead of when its shard reaches the suite that used to check it. Pull
  # requests and pushes to main both run gdlint on every file, so a PR sees what main will.
  lint:
    needs: plan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ fromJSON(needs.plan.outputs.runner || '"ubuntu-latest"') }}
    timeout-minutes: 20   # a PC runner's first checkout fetches about 1.6 GB
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2     # the PR merge commit and the base it merges into
          filter: blob:none   # fetch only the files checked out
          sparse-checkout-cone-mode: false
          sparse-checkout: |   # .claude/review (5 GB of review boards) is never read by CI
            /*
            !/.claude/review/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/lint/requirements.txt

      - name: Install gdlint (gdtoolkit, pinned)
        run: python -m pip install -r tools/lint/requirements.txt

      - name: The lints' own tests
        run: python3 -I tools/lint/test_lint.py

      - name: Static lints
        if: success() || failure()
        # Every event lints every file the same way (about 30 s): a PR that linted only its own
        # files passed while the merged tree failed on main, and every open PR went red with it
        # (2026-11-11: 12 main pushes red in lint for 1.6 h).
        run: python3 -I tools/lint/lint.py --require-gdlint

      # The pure-Python checks that ran inside the Godot extras job until 2026-11-12.
      - name: Dataset check
        if: success() || failure()
        run: python3 tools/validate_data.py

      - name: No suite starts from the clock
        if: success() || failure()
        run: bash tools/check_suite_seeds.sh

      - name: Intake / development harness
        if: success() || failure()
        run: python3 tools/intake_harness.py --quiet

      - name: No Epic/MetaHuman files in this public repo (docs/EPIC_ASSETS.md)
        if: success() || failure()
        run: python3 -I tools/check_epic_files.py

      - name: Offline promise (the Android preset requests vibrate only)
        if: success() || failure()
        run: |
          python3 tools/test_android_permissions.py
          python3 tools/check_android_permissions.py

  # A test runner that does not compile (or hangs on load) fails here in seconds,
  # not as a 15-minute shard timeout. Only the compile check: no suite runs here,
  # so the shards start as soon as it passes.
  preflight:
    needs: plan
    if: needs.plan.outputs.code == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ${{ fromJSON(needs.plan.outputs.runner || '"ubuntu-latest"') }}
    timeout-minutes: 25   # the first import of every ground's 3D model and background scene takes up to 20 min on a runner
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none   # fetch only the files checked out
          sparse-checkout-cone-mode: false
          sparse-checkout: |   # .claude/review (5 GB of review boards) is never read by CI
            /*
            !/.claude/review/

      - name: Epic/MetaHuman files (private repo, docs/EPIC_ASSETS.md)
        uses: ./.github/actions/epic-assets
        with:
          token: ${{ secrets.EPIC_ASSETS_TOKEN || secrets.MERGE_TOKEN }}

      - name: Cache Godot
        id: godot-cache
        # GitHub's runners only: the cache stores ~/godot relative to the workspace, which puts it
        # in the wrong folder on a PC runner. A PC runner keeps its own ~/godot between jobs.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          if [ -x ~/godot/godot ] && [ "$(cat ~/godot/VERSION 2>/dev/null)" = "$GODOT_VERSION" ]; then
            echo "Godot $GODOT_VERSION is already on this runner"; exit 0
          fi
          tmp=$(mktemp -d) && cd "$tmp"
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip" \
          || curl -fsSL --retry 3 -o godot.zip \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip && chmod +x "${name}"
          # A rename, so PC runners sharing ~/godot never see a half-written file.
          mkdir -p ~/godot && mv "${name}" ~/godot/godot.$$ && mv -f ~/godot/godot.$$ ~/godot/godot
          echo "$GODOT_VERSION" > ~/godot/VERSION && cd / && rm -rf "$tmp"

      # Every test runner must compile, and its load must not hang, before the
      # shards start: a runner naming a class whose load chain reaches an autoload
      # hung a shard for the full 900 s timeout three times on 2026-10-17/18.
      - name: Every test runner compiles
        run: GODOT="$HOME/godot/godot" bash tools/ci_preflight_compile.sh

  shard:
    name: shard ${{ matrix.shard }}
    needs: [plan, lint, preflight]
    # !cancelled(), not always(): always() let a cancelled or superseded run keep running and
    # starting its shards (2026-11-26: 15 cancelled runs still held runners half an hour later).
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success' && needs.plan.outputs.code == 'true' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runner || '"ubuntu-latest"') }}
    # A shard plans ~240 s; 40 still covers a 900 s suite timeout run twice. A PC runner runs two
    # shards side by side at about half a GitHub runner's speed: shard 1 (22 min on GitHub) hit 40 there
    # on 2026-11-26, so PC-routed shards get 75.
    timeout-minutes: ${{ contains(needs.plan.outputs.runner, 'afl-queue') && 75 || 40 }}
    strategy:
      # PRs release runner slots promptly; main/manual diagnostics collect all failures.
      fail-fast: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none   # fetch only the files checked out
          sparse-checkout-cone-mode: false
          sparse-checkout: |   # .claude/review (5 GB of review boards) is never read by CI
            /*
            !/.claude/review/

      - name: Epic/MetaHuman files (private repo, docs/EPIC_ASSETS.md)
        uses: ./.github/actions/epic-assets
        with:
          token: ${{ secrets.EPIC_ASSETS_TOKEN || secrets.MERGE_TOKEN }}

      - name: Cache Godot
        id: godot-cache
        # GitHub's runners only: the cache stores ~/godot relative to the workspace, which puts it
        # in the wrong folder on a PC runner. A PC runner keeps its own ~/godot between jobs.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          if [ -x ~/godot/godot ] && [ "$(cat ~/godot/VERSION 2>/dev/null)" = "$GODOT_VERSION" ]; then
            echo "Godot $GODOT_VERSION is already on this runner"; exit 0
          fi
          tmp=$(mktemp -d) && cd "$tmp"
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip" \
          || curl -fsSL --retry 3 -o godot.zip \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip && chmod +x "${name}"
          # A rename, so PC runners sharing ~/godot never see a half-written file.
          mkdir -p ~/godot && mv "${name}" ~/godot/godot.$$ && mv -f ~/godot/godot.$$ ~/godot/godot
          echo "$GODOT_VERSION" > ~/godot/VERSION && cd / && rm -rf "$tmp"

      - name: Run the suites in this shard
        env:
          SUITES: ${{ matrix.suites }}
          STOP_ON_FAILURE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '1' || '0' }}
        # Flaky rule (#894, 2026-11-04): a failed shard retries once, and a pass on the retry is
        # green but flagged FLAKY. The retry runs only the suites that did not pass, and only
        # when none failed a check outright: the suites are seeded (tools/check_suite_seeds.sh),
        # so "N checks, F failures" fails the same way twice, while a crash, a script error or a
        # timeout may be the engine. A shard over 10 minutes only warns.
        run: |
          start=$(date +%s)
          results="$RUNNER_TEMP/suite-results.tsv"
          run() { : > "$results"; SUITE_RESULTS="$results" SUITES_ONLY=1 GODOT="$HOME/godot/godot" LOG_DIR="$RUNNER_TEMP/test-logs" tools/run_tests.sh "$@"; }
          if ! run $SUITES; then
            real=$(awk '$2 == "checks" {print $1}' "$results" | xargs)
            if [ -n "$real" ]; then
              echo "::error::shard ${{ matrix.shard }}: failed checks in $real (seeded, so a retry would fail the same way; not retried)"
              exit 1
            fi
            again=""
            for s in $SUITES; do awk -v s="$s" '$1 == s && $2 == "pass" {f=1} END {exit !f}' "$results" || again="$again $s"; done
            echo "::warning::shard ${{ matrix.shard }} failed (crash, script error or timeout); retrying once:$again"
            run $again
            echo "::warning::FLAKY: shard ${{ matrix.shard }} ($again) passed only on retry"
            echo "FLAKY: shard ${{ matrix.shard }} ($again) passed only on retry" >> "$GITHUB_STEP_SUMMARY"
          fi
          took=$(( $(date +%s) - start ))
          if [ "$took" -gt 600 ]; then echo "::warning::shard ${{ matrix.shard }} took ${took}s (gate target 600s)"; fi

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true  # a GitHub storage outage must not fail tested code
        with:
          name: test-logs-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-logs

      - name: Preserve suite timings even when tests fail
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/timings"
          if [ -f "$RUNNER_TEMP/test-logs/suite-timings.tsv" ]; then
            cp "$RUNNER_TEMP/test-logs/suite-timings.tsv" "$RUNNER_TEMP/timings/shard-${{ matrix.shard }}.tsv"
          fi
          # Per test function (tests/functions_ran.gd): what makes a suite slow.
          if [ -f "$RUNNER_TEMP/test-logs/fn-timings.tsv" ]; then
            cp "$RUNNER_TEMP/test-logs/fn-timings.tsv" "$RUNNER_TEMP/timings/fn-shard-${{ matrix.shard }}.tsv"
          fi

      - uses: actions/upload-artifact@v4
        continue-on-error: true  # a GitHub storage outage must not fail tested code
        if: always()
        with:
          name: suite-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings
          if-no-files-found: warn

  # What run_tests.sh does after the suites that needs Godot: the exported build's data check
  # and the runner's own self-test. (The build-number check ran once, in plan; the dataset,
  # seeds, intake harness and offline-promise checks run in lint.)
  extras:
    name: dataset and harness checks
    needs: [plan, lint, preflight]
    # !cancelled(), not always(): always() let a cancelled or superseded run keep running and
    # starting its shards (2026-11-26: 15 cancelled runs still held runners half an hour later).
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success' && needs.plan.outputs.code == 'true' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') && github.event_name != 'schedule' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runner || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none   # fetch only the files checked out
          sparse-checkout-cone-mode: false
          sparse-checkout: |   # .claude/review (5 GB of review boards) is never read by CI
            /*
            !/.claude/review/

      - name: Epic/MetaHuman files (private repo, docs/EPIC_ASSETS.md)
        uses: ./.github/actions/epic-assets
        with:
          token: ${{ secrets.EPIC_ASSETS_TOKEN || secrets.MERGE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Godot
        id: godot-cache
        # GitHub's runners only: the cache stores ~/godot relative to the workspace, which puts it
        # in the wrong folder on a PC runner. A PC runner keeps its own ~/godot between jobs.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          if [ -x ~/godot/godot ] && [ "$(cat ~/godot/VERSION 2>/dev/null)" = "$GODOT_VERSION" ]; then
            echo "Godot $GODOT_VERSION is already on this runner"; exit 0
          fi
          tmp=$(mktemp -d) && cd "$tmp"
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip" \
          || curl -fsSL --retry 3 -o godot.zip \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip && chmod +x "${name}"
          # A rename, so PC runners sharing ~/godot never see a half-written file.
          mkdir -p ~/godot && mv "${name}" ~/godot/godot.$$ && mv -f ~/godot/godot.$$ ~/godot/godot
          echo "$GODOT_VERSION" > ~/godot/VERSION && cd / && rm -rf "$tmp"

      - name: Run the dataset, export and harness checks
        run: SKIP_STATIC=1 SKIP_VERSION_CHECK=1 EXTRAS_ONLY=1 GODOT="$HOME/godot/godot" LOG_DIR="$RUNNER_TEMP/test-logs" tools/run_tests.sh

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true  # a GitHub storage outage must not fail tested code
        with:
          name: test-logs-extras
          path: ${{ runner.temp }}/test-logs

  # The required check. Its name stays "test" so branch protection is unchanged.
  test:
    needs: [plan, lint, preflight, shard, extras]
    if: always()
    runs-on: ${{ fromJSON(needs.plan.outputs.runner || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      # Only what the two steps below read: the shard plan (tools/*.py and its lists) and the
      # suite names (tests/run_*_tests.gd). The tree hash needs no files. A full checkout here
      # took 2 to 3 minutes, on the last job of every run.
      - uses: actions/checkout@v4
        if: needs.plan.outputs.code == 'true' && needs.plan.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
        with:
          filter: blob:none   # fetch only the files checked out
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/*.py
            /tools/*.txt
            /tools/*.json
            /tests/run_*_tests.gd

      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.code == 'true' && needs.plan.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
        with:
          pattern: suite-timings-*
          path: ${{ runner.temp }}/suite-timings
          merge-multiple: true

      - name: Report observed shard imbalance
        if: needs.plan.outputs.code == 'true' && needs.plan.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
        run: python3 tools/check_ci_balance.py --observed "$RUNNER_TEMP/suite-timings"

      # Records the exact files this green run tested, so the push to main that
      # squashes this PR unchanged can skip its shards (tools/ci_same_tree.sh).
      - name: Record the tested tree
        id: tree
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.plan.outputs.code == 'true' && needs.plan.outputs.partial != 'true' && needs.shard.result == 'success' && needs.extras.result == 'success' && needs.preflight.result == 'success' && needs.lint.result == 'success'
        run: |
          tree=$(git rev-parse HEAD^{tree})
          echo "$tree" > "$RUNNER_TEMP/tree.txt"
          echo "name=tested-tree-$tree" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        continue-on-error: true  # a GitHub storage outage must not fail tested code
        if: steps.tree.outcome == 'success'
        with:
          name: ${{ steps.tree.outputs.name }}
          path: ${{ runner.temp }}/tree.txt
          retention-days: 7

      - name: Every job passed
        if: always()
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          LINT: ${{ needs.lint.result }}
          PLAN: ${{ needs.plan.result }}
          CODE: ${{ needs.plan.outputs.code }}
          REASON: ${{ needs.plan.outputs.reason }}
          SHARDS: ${{ needs.shard.result }}
          EXTRAS: ${{ needs.extras.result }}
        run: |
          echo "plan=$PLAN lint=$LINT code=$CODE shards=$SHARDS extras=$EXTRAS"
          # A draft skips every other job, and its check must never pass: auto-merge would fire
          # on it the moment the PR is marked ready, before the real run starts (#1359).
          if [ "${{ github.event_name }}" = pull_request ] && [ "${{ github.event.pull_request.draft }}" = true ]; then
            echo "::error::draft pull request: nothing has run, so this check does not pass. Mark it ready for review to run the tests."
            exit 1
          fi
          if [ "$LINT" != success ]; then
            echo "::error::the lint job failed: a static rule, gdlint or a data check (tools/lint/README.md); its log names each file and line"
            exit 1
          fi
          if [ "$PLAN" != success ]; then
            echo "::error::the plan job failed: a suite is in two shards of tools/ci_shards.txt, a plan check failed, or the checkout failed"
            exit 1
          fi
          if [ "$PREFLIGHT" != success ] && [ "$PREFLIGHT" != skipped ]; then
            echo "::error::the preflight (a test runner does not compile) failed or was cancelled; full tests did not pass"
            exit 1
          fi
          if [ "$CODE" = true ]; then
            # The nightly balance run skips the dataset and harness checks.
            if [ "$SHARDS" != success ] || { [ "$EXTRAS" != success ] && [ "${{ github.event_name }}" != schedule ]; }; then
              echo "::error::a test shard or the dataset and harness checks did not pass"
              exit 1
            fi
          else
            echo "The game tests were skipped ($REASON)."
            # A draft's skipped run must never count as a pass: auto-merge would fire on
            # it the moment the PR is marked ready, before the real run starts (#1359).
            case "$REASON" in
              draft*)
                echo "::error::draft pull request: the game tests have not run, so this check does not pass. Mark it ready for review to run them."
                exit 1 ;;
            esac
          fi
